format:
  html:
    theme:
      light: [default, styles.scss]
      dark: [darkly, styles.scss]
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css?family=Inter:400,400i,500,600,700%7CJetBrains+Mono:400,700&display=swap" rel="stylesheet">
    # The "Comment on this page" link, pointing at this page's standing thread
    # in the private notes repository. Generated, with the page-to-thread map,
    # by scripts/comment_threads.py — regenerate after adding a chapter.
    include-after-body: comments.html
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    code-fold: true
    code-tools: false
    link-external-newwindow: true
    html-math-method: mathjax
    smooth-scroll: true
    fig-cap-location: bottom
    tbl-cap-location: top
    lang: en
    grid:
      # Widened 21 September on the coordination's remark: the body column was
      # 720px against a right-hand margin that left most of a wide screen
      # empty. 880px gives the running text about a fifth more room — roughly
      # 90 characters to the line, still inside the comfortable measure — and
      # pushes the "En esta página" column right by the same amount. The
      # margin stays at 260px because the synthesis asides live in it.
      sidebar-width: 310px
      body-width: 880px
      margin-width: 260px

bibliography: references.bib
csl: apa.csl
link-citations: true

execute:
  freeze: auto
  echo: false
  warning: false
